<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafios Interativos</title>
    <!-- Importando a Fonte Premium Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1b3c0; border-radius: 4px; border: 2px solid #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #97164f; }
        
        .no-wrap-value { white-space: nowrap !important; display: inline-block; }

        #app { min-height: 100vh; border-radius: 0; border: none; box-shadow: none; }
        
        .tooltip-text {
            visibility: hidden; opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translateY(5px);
        }
        .tooltip-group:hover .tooltip-text {
            visibility: visible; opacity: 1; transform: translateY(0);
        }
    </style>
</head>
<body class="flex items-start justify-center min-h-screen text-gray-800">

    </div>

                                    <td class="px-4 py-3 md:p-4 text-right text-gray-600 w-[1%] whitespace-nowrap tabular-nums text-base md:text-lg">R$ 60.000<span class="invisible">)</span></td>

                    "C) A concessão é justificada se desconsiderarmos a distorção do CPC 51. Ao realocar os juros bancários para a Categoria de Financiamento na DR, a norma na prática proíbe a empresa de reportá-los no FCO da DFC, forçando um caixa operacional aparentemente negativo que mascara a real capacidade do giro da empresa.",

                ],

                feedbacks: [
                    "Incorreto. Uma confusão já clássica na contabidade: a depreciação NÃO é uma reserva financeira e não acumula dinheiro. Ela é somada no Método Indireto da DFC apenas para anular o efeito redutor que teve na DR (já que não representou saída de caixa no período), mas não cria liquidez alguma para pagar dívidas.",
                    "Perfeito! Você assumiu o papel do analista que não se ilude com a última linha da DR. O lucro utiliza o regime de competência, mas o banco é pago com caixa. O MEP e as Operações Descontinuadas representaram 55% do lucro (R$ 110.000), mas não colocaram dinheiro imediato na conta. Com R$ 380 mil vencendo e só R$ 50 mil em caixa, a empresa precisa do empréstimo para sobreviver, e não apenas para girar.",
                    "Incorreto. Você confundiu o impacto normativo. O CPC 51 afeta a apresentação ao alinhar a DR e a DFC. No entanto, classificar juros como financiamento <b>aumenta</b> (melhora) o Fluxo de Caixa Operacional, e não o contrário. A queima de caixa neste caso veio principalmente de ineficiência no capital de giro (Contas a Receber e Fornecedores).",
                    "Incorreto. Contas a Receber possui risco de crédito (inadimplência) e prazos que podem ser incertos também. Para honrar um Passivo Circulante que vence nos próximos 90 dias, recebíveis que ainda podem demorar a entrar e que não são simultanealmente 'líquidos e certos' não substituem o Caixa (Disponibilidades). Dinheiro 'na mão' e direito a receber são avaliados de formas diferentes."
                ]
            },
            {
                title: "Atividade 2: DMPL e DVA",
                roleplay: "Você é o gestor de um <strong>Fundo de Ações</strong> focado em empresas que remuneram bem seus acionistas, seja por fluxo de caixa transferido ou valor agregado. Ao avaliar a política de alocação de capital da Completinha S.A., você nota que a empresa reportou um Lucro Líquido de R$ 200.000. Durante a Assembleia Geral, um grupo de acionistas minoritários acusa a diretoria de não compartilhar a riqueza gerada, pois o pagamento de dividendos foi 'baixo'. Você abre a DMPL e a DVA para investigar o fato.",
                panel: `
                    <div class="bg-white border border-[#97164f] rounded-xl overflow-hidden mb-8 shadow-sm">

                question: "Cruzando a mecânica de destinação evidenciada na DMPL com os princípios de mensuração do PIB contábil na Demonstração do Valor Adicionado (DVA), qual deve ser o seu veredito técnico na assembleia sobre a remuneração dos acionistas ?",

                    "Incorreto. O valor recebido em dividendos (R$ 50.000) não resume a riqueza destinada aos acionistas na DVA. O Lucro Retido (R$ 150.000) também compõe a 'Remuneração de Capitais Próprios', significando que a empresa compartilhou a riqueza mantendo o valor dentro da cota do acionista.",
                    "Incorreto. Este distrator mistura os conceitos da DVA. 'Insumos Adquiridos de Terceiros' referem-se aos bens e serviços usados para gerar a receita. A Reserva de Expansão é a destinação (distribuição) do lucro líquido, e jamais um insumo de terceiros.",

                                <li><strong>Nota 12 (Op. Descontinuadas):</strong> <span class="bg-yellow-100/50">R$ 55 mil do lucro (27,5% do total) decorrem de ganho de capital na venda emergencial de um parque fabril desativado.</span></li>
                                <li><strong>Nota 18 (Endividamento):</strong> R$ 380 mil vencem nos primeiros 90 dias de 2028, decorrente de políticas de expanções em 'clientes' com a concessão de prazos, consequentemente afetando o caixa e pagamentos em 2027.</li>
                                <li><strong>Nota 24 (Despesas por Natureza):</strong> A alegada 'redução de custos' ocorreu por <span class="bg-yellow-100/50">corte de 30% do quadro técnico e postergação de manutenção que afetam a capacidade produtiva futura</span> de maquinários.</li>
                                <li><strong>Formato Geral:</strong> Mais de 20 páginas discorrendo sobre conceitos teóricos do CPC 00 e CPC 26, sem o detalhamento dos riscos práticos.</li>
                            </ul>
                        </div>
                    </div>
                `,
                question: "Ao realizar a análise informacional da empresa, como você deve avaliar criticamente o conjunto formado pelo Relatório da Administração e pelas Notas Explicativas?",
                options: [
                    "A) A divulgação é robusta e justificada. O empenho em reprodução de textos normativos nas Notas Explicativas garante a conformidade com as exigências da CVM, enquanto o Relatório da Administração exerce de forma legítima o seu papel focado em otimismo comercial.",
                    "B) Há claro gerenciamento de impressões (Impression Management) no Relatório da Administração ao omitir que a eficiência veio de cortes insustentáveis e da alienação de ativos. Simultaneamente, as Notas Explicativas descumprem a OCPC 07 pelo inchaço informativo, usando teoria genérica para camuflar o risco prático da operação.",
                    "C) A omissão sobre as operações descontinuadas no MD&A não configura assimetria informacional grave, desde que o montante de R$ 55.000 esteja perfeitamente isolado e auditado na respectiva linha da DR, garantindo a primazia dos dados quantitativos.",
                    "D) A empresa incorreu em grave desvio técnico (Resolução CVM 80/2022) ao reportar a venda do parque fabril na Nota 12, quando a norma exige a criação de uma Medida de Desempenho (MDDA), como o 'EBITDA Ajustado', no próprio corpo do balanço para tratar esses efeitos não-recorrentes."
                ],
                correctIndex: 1,
                feedbacks: [
                    "Incorreto. O 'disclosure defensivo', nesse caso, sendo copiar o CPC apenas para coordenar uma narrativa que distorce, é uma limitação da qualidade contábil fortemente combatida pelos normatizadores. Notas devem trazer a realidade da empresa, não a teoria do manual. Além disso, o otimismo comercial não pode violar a representação fidedigna das operações.",
                    "Brilhante! Você identificou a armadilha. O Relatório da Administração foi usado para distorcer a realidade (Impression Management), vendendo uma 'excelência' que, na verdade, era venda de patrimônio (R$ 55 mil) e cortes perigosos. Paralelamente, copiar teoria para as notas é condenado pela OCPC 07, pois cria o Disclosure Overload, dificultando a visualização de que a empresa está à beira de um abismo de liquidez com R$ 380 mil vencendo.",
                    "Incorreto. O Relatório da Administração é o principal canal de diálogo narrativo da gestão com o mercado. Omitir nele a natureza não recorrente de quase um terço do resultado, creditando o lucro exclusivamente à 'eficiência', induz os Stekeholders a erro e agrava severamente a assimetria informacional.",
                    "Incorreto. Nenhuma norma ou resolução *exige* a criação de uma MDDA. A exigência contábil real é a evidenciação da operação descontinuada no DR e na respectiva Nota Explicativa. O erro real da empresa foi o tom de gerenciamento de impressões na narrativa do MD&A e o inchaço informacional."
                ]
            }
        ];

        const motivationalQuotes = [
            "O insucesso é apenas uma oportunidade para recomeçar com mais inteligência. – Henry Ford",
            "Eu não falhei. Só descobri 10 mil caminhos que não eram o certo. – Thomas Edison",
            "O maior erro que você pode cometer é o de ficar o tempo todo com medo de cometer algum. – Elbert Hubbard",
            "O sucesso é ir de fracasso em fracasso sem perder o entusiasmo. – Winston Churchill",
        ];

        const app = document.getElementById('app');

        function navigate(state, push = true) {
            if (push) { history.pushState(state, "", ""); }
            if (state.view === 'home') _renderHome();
            else if (state.view === 'placeholder') _renderPlaceholder(state.title);
            else if (state.view === 'menu') _renderSeminarioMenu();
            else if (state.view === 'activity') _renderActivity(state.index);
            else if (state.view === 'feedback') _renderFeedback(state.actIndex, state.optIndex);
        }

        window.addEventListener('popstate', (e) => {
            if (e.state) { navigate(e.state, false); } 
            else { navigate({ view: 'home' }, false); }
        });

        function renderHome() { navigate({ view: 'home' }); }
        function renderPlaceholder(title) { navigate({ view: 'placeholder', title: title }); }
        function renderSeminarioMenu() { navigate({ view: 'menu' }); }
        function renderActivity(index) { navigate({ view: 'activity', index: index }); }
        
        function handleAnswer(activityIndex, selectedOptionIndex) { 
            const act = activities[activityIndex];
            const isCorrect = selectedOptionIndex === act.correctIndex;
            
            appState.attempts[activityIndex]++;
            
            if(!isCorrect) {
                const btn = document.getElementById(`opt-btn-${selectedOptionIndex}`);
                btn.classList.add('shake', 'bg-red-50', 'border-red-400', 'text-red-900');
                setTimeout(() => { navigate({ view: 'feedback', actIndex: activityIndex, optIndex: selectedOptionIndex }); }, 400);
            } else {
                appState.completed[activityIndex] = true;
                navigate({ view: 'feedback', actIndex: activityIndex, optIndex: selectedOptionIndex });
            }
        }

        function _renderHome() {
            app.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center fade-in py-10 lg:py-20 w-full max-w-5xl mx-auto my-auto">
                    <div class="w-24 h-24 bg-white text-[#97164f] border-2 border-[#97164f] rounded-2xl flex items-center justify-center mb-8 shadow-sm transform rotate-3 transition-transform hover:rotate-6 duration-300">
                        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    </div>
                    <h1 class="text-4xl md:text-6xl font-black text-gray-800 mb-6 tracking-tight text-pretty">Completinha S.A.</h1>
                    <p class="text-gray-500 mb-14 text-xl font-medium text-pretty">Plataforma de Casos Práticos e Simulações Societárias</p>
                    
                    <div class="w-full max-w-2xl mx-auto space-y-6">
                        <button onclick="renderSeminarioMenu()" class="w-full bg-[#97164f] hover:bg-[#7a123f] text-white font-bold text-2xl py-6 px-8 rounded-2xl transition-all duration-200 shadow-lg hover:shadow-xl hover:-translate-y-1 flex justify-between items-center group">
                            <span>Atividades do Seminário</span>
                            <svg class="w-8 h-8 transform group-hover:translate-x-2 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                        
                        <button onclick="renderPlaceholder('Atividades Adicionais')" class="w-full bg-white border border-gray-200 hover:border-[#97164f] text-gray-700 font-semibold text-xl py-6 px-8 rounded-2xl transition-all duration-200 shadow-sm hover:shadow-md hover:-translate-y-1 flex justify-between items-center">
                            <span>Atividades Adicionais</span>
                            <span class="text-sm bg-[#fdf2f4] text-[#97164f] px-3 py-1 rounded-lg font-bold">Em definição</span>
                        </button>
                        
                        <button onclick="renderPlaceholder('Testes de Personalidade')" class="w-full bg-white border border-gray-200 hover:border-[#97164f] text-gray-700 font-semibold text-xl py-6 px-8 rounded-2xl transition-all duration-200 shadow-sm hover:shadow-md hover:-translate-y-1 flex justify-between items-center">
                            <span>Testes de Personalidade</span>
                            <span class="text-sm bg-[#fdf2f4] text-[#97164f] px-3 py-1 rounded-lg font-bold">Em definição</span>
                        </button>
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function _renderPlaceholder(title) {
            app.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center fade-in py-16 w-full max-w-5xl mx-auto my-auto">
                    <div class="w-24 h-24 bg-white border border-gray-200 text-gray-400 rounded-full flex items-center justify-center mb-8 shadow-sm">
                        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h2 class="text-4xl md:text-5xl font-bold text-gray-800 mb-6 text-pretty">${title}</h2>
                    <p class="text-gray-500 text-xl md:text-2xl mb-12 font-medium max-w-2xl mx-auto text-pretty">Esta seção está em estruturação e será disponibilizada num futuro próximo.</p>
                    <button onclick="renderHome()" class="w-full max-w-sm bg-gray-800 hover:bg-gray-900 text-white font-bold text-xl py-5 px-8 rounded-2xl transition-all duration-200 shadow-md hover:shadow-lg hover:-translate-y-1">
                        Voltar ao Início
                    </button>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function _renderSeminarioMenu() {
            let buttonsHtml = '';
            activities.forEach((act, index) => {
                const isCompleted = appState.completed[index];
                const badgeHtml = isCompleted 
                    ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-lg text-sm font-bold flex items-center"><svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> Concluída</span>` 
                    : `<span class="text-sm font-bold text-[#97164f] tracking-widest uppercase bg-[#fdf2f4] px-4 py-1.5 rounded-lg">Atividade ${index + 1}</span>`;

                buttonsHtml += `
                    <button onclick="renderActivity(${index})" class="w-full text-left bg-white border border-gray-200 hover:border-[#97164f] p-8 md:p-10 rounded-2xl transition-all duration-200 shadow-sm hover:shadow-lg hover:-translate-y-1 group">
                        <div class="flex items-center justify-between mb-4">
                            ${badgeHtml}
                            <svg class="w-8 h-8 text-gray-300 group-hover:text-[#97164f] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                        <div class="text-2xl md:text-3xl font-bold text-gray-800 group-hover:text-[#97164f] transition-colors text-pretty">${act.title.split(': ')[1]}</div>
                    </button>
                `;
            });

            app.innerHTML = `
                <div class="fade-in flex flex-col w-full max-w-5xl mx-auto py-6 md:py-10">
                    <div class="flex items-center mb-12 border-b border-gray-200 pb-6">
                        <button onclick="renderHome()" class="text-gray-500 hover:text-[#97164f] mr-6 transition-colors bg-white border border-gray-200 hover:border-[#97164f] p-3 rounded-xl shadow-sm">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <div>
                            <h2 class="text-3xl md:text-4xl font-black text-gray-800 tracking-tight">Atividades do Seminário</h2>
                            <p class="text-lg md:text-xl text-gray-500 mt-2 font-medium">Selecione uma simulação baseada na Completinha S.A.</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-6">
                        ${buttonsHtml}
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function _renderActivity(index) {
            const act = activities[index];
            let optionsHtml = '';
            
            const progressPercent = ((index + 1) / activities.length) * 100;
            
            act.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <button id="opt-btn-${optIndex}" onclick="handleAnswer(${index}, ${optIndex})" class="w-full text-left p-6 mb-6 bg-white border-2 border-gray-200 rounded-xl hover:bg-[#fdf2f4] active:bg-gray-100 hover:border-[#97164f] transition-all duration-200 hover:-translate-y-1 hover:shadow-md text-lg md:text-xl font-medium text-gray-800 leading-relaxed shadow-sm text-pretty relative">
                        ${opt}
                    </button>
                `;
            });

            app.innerHTML = `
                <div class="fade-in flex flex-col w-full h-full xl:max-w-[1400px] mx-auto">
                    
                    <div class="w-full bg-gray-200 h-1.5 rounded-full mb-6 overflow-hidden">
                        <div class="bg-[#97164f] h-1.5 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                    </div>
                    
                    <div class="flex items-center justify-between mb-8 border-b border-gray-200 pb-4">
                        <button onclick="renderSeminarioMenu()" class="text-gray-500 hover:text-[#97164f] flex items-center text-base font-bold transition-colors bg-white border border-gray-200 hover:border-[#97164f] px-5 py-2.5 rounded-xl shadow-sm">
                            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Voltar
                        </button>
                        <span class="text-sm font-bold text-[#97164f] bg-white px-5 py-2.5 rounded-xl border border-[#d1b3c0] uppercase tracking-wider shadow-sm">Atividade ${index + 1} de ${activities.length}</span>
                    </div>
                    
                    <div class="flex flex-col lg:flex-row gap-10 xl:gap-16 pb-10">
                        <div class="w-full lg:w-[48%]">
                            <div class="bg-white border-l-4 border-[#97164f] border-y border-r border-gray-200 p-6 rounded-r-2xl mb-8 shadow-md">
                                <h3 class="text-[#97164f] font-black text-sm md:text-base uppercase mb-3 flex items-center tracking-wide">
                                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                    Cenário (Seu Papel)
                                </h3>
                                <p class="text-lg md:text-xl text-gray-800 leading-relaxed text-pretty">${act.roleplay}</p>
                            </div>
                            ${act.panel}
                        </div>
                        
                        <div class="w-full lg:w-[52%] flex flex-col pt-2">
                            <h2 class="text-xl md:text-2xl font-bold text-gray-900 mb-8 leading-relaxed border-b border-gray-200 pb-5 text-pretty">${act.question}</h2>
                            <div class="space-y-4">
                                ${optionsHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function _renderFeedback(activityIndex, selectedOptionIndex) {
            const act = activities[activityIndex];
            const isCorrect = selectedOptionIndex === act.correctIndex;
            const feedbackText = act.feedbacks[selectedOptionIndex];
            
            if(isCorrect) {
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.5 },
                    colors: ['#97164f', '#d1b3c0', '#fdf2f4', '#10b981']
                });
            }

            const headerColor = isCorrect ? 'text-emerald-600' : 'text-[#97164f]';
            const icon = isCorrect 
                ? '<svg class="w-24 h-24 text-emerald-500 mx-auto mb-6 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'
                : '<svg class="w-24 h-24 text-[#97164f] mx-auto mb-6 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            
            let title = isCorrect ? 'Diagnóstico Correto!' : 'Foi quase! Tente novamente.';
            
            let quoteHtml = '';
            let attemptHtml = '';
            
            if(!isCorrect) {
                const randomQuote = motivationalQuotes[Math.floor(Math.random() * motivationalQuotes.length)];
                quoteHtml = `<div class="italic text-gray-500 text-lg mt-8 px-6 border-t border-gray-200 pt-6">"${randomQuote}"</div>`;
                attemptHtml = `<span class="bg-gray-100 text-gray-600 text-sm font-bold px-3 py-1 rounded-full absolute top-6 right-6 shadow-sm">Tentativa nº ${appState.attempts[activityIndex]}</span>`;
            }

            app.innerHTML = `
                <div class="fade-in flex flex-col text-center py-10 w-full max-w-5xl mx-auto my-auto relative">
                    <div class="flex-1 mt-4">
                        ${icon}
                        <h2 class="text-4xl md:text-6xl font-black ${headerColor} mb-10 tracking-tight text-pretty">${title}</h2>
                        <div class="bg-white p-8 md:p-12 rounded-3xl border border-gray-200 text-left shadow-xl relative">
                            ${attemptHtml}
                            <p class="text-xl md:text-2xl text-gray-800 leading-relaxed text-pretty">
                                <span class="font-black ${headerColor} block mb-4 uppercase tracking-widest text-sm border-b border-gray-200 pb-2">Análise Técnica</span> 
                                ${feedbackText}
                            </p>
                        </div>
                        ${quoteHtml}
                    </div>
                    <div class="mt-12 flex flex-col sm:flex-row gap-5 justify-center">
                        ${!isCorrect ? `
                            <button onclick="renderActivity(${activityIndex})" class="w-full sm:w-auto bg-white border-2 border-gray-300 hover:bg-gray-50 text-gray-800 font-bold text-xl py-5 px-10 rounded-2xl transition-all duration-200 shadow-sm hover:shadow-md hover:-translate-y-1">
                                Tentar Novamente
                            </button>
                        ` : ''}
                        <button onclick="renderSeminarioMenu()" class="w-full sm:w-auto bg-gray-800 hover:bg-gray-900 text-white font-bold text-xl py-5 px-10 rounded-2xl transition-all duration-200 shadow-md hover:shadow-lg hover:-translate-y-1">
                            Voltar ao Menu
                        </button>
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        history.replaceState({ view: 'home' }, "", "");
        _renderHome();
    </script>
</body>
</html>
