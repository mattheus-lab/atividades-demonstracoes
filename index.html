                question: "Ao confrontar o desempenho econômico reportado na DRE (estruturada conforme o CPC 51) com a dinâmica de conversão financeira na DFC (Método Indireto) e os saldos de liquidez do Balanço Patrimonial, qual diagnóstico técnico deve fundamentar a sua decisão de conceder ou negar a linha de crédito?",

                question: "Cruzando a mecânica de destinação evidenciada na DMPL com os princípios de mensuração do PIB contábil na Demonstração do Valor Adicionado (DVA), qual deve ser o seu veredito técnico na assembleia sobre a remuneração dos acionistas?",

                            <svg class="w-7 h-7 transform group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                        
                        <button onclick="renderPlaceholder('Atividades Adicionais')" class="w-full bg-white border border-gray-200 hover:border-[#97164f] text-gray-700 font-semibold text-lg py-5 px-6 rounded-2xl transition duration-200 flex justify-between items-center shadow-sm">
                            <span>Atividades Adicionais</span>
                            <span class="text-sm bg-[#fdf2f4] text-[#97164f] px-3 py-1 rounded-lg font-bold">Em definição</span>
                        </button>
                        
                        <button onclick="renderPlaceholder('Testes de Personalidade')" class="w-full bg-white border border-gray-200 hover:border-[#97164f] text-gray-700 font-semibold text-lg py-5 px-6 rounded-2xl transition duration-200 flex justify-between items-center shadow-sm">
                            <span>Testes de Personalidade</span>
                            <span class="text-sm bg-[#fdf2f4] text-[#97164f] px-3 py-1 rounded-lg font-bold">Em definição</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderPlaceholder(title) {
            app.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center fade-in py-16 w-full max-w-4xl mx-auto">
                    <div class="w-24 h-24 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center mb-8">
                        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h2 class="text-4xl font-bold text-gray-800 mb-4">${title}</h2>
                    <p class="text-gray-500 text-xl mb-12 font-medium max-w-lg mx-auto">Esta seção está em estruturação e será disponibilizada num futuro próximo.</p>
                    <button onclick="renderHome()" class="w-full max-w-sm bg-gray-800 hover:bg-gray-900 text-white font-bold text-lg py-5 px-8 rounded-2xl transition duration-200 shadow-md">
                        Voltar ao Início
                    </button>
                </div>
            `;
        }

        function renderSeminarioMenu() {
            app.innerHTML = `
                <div class="fade-in flex flex-col w-full max-w-4xl mx-auto py-6 md:py-10">
                    <div class="flex items-center mb-12 border-b border-gray-200 pb-6">
                        <button onclick="renderHome()" class="text-gray-400 hover:text-[#97164f] mr-6 transition bg-gray-50 hover:bg-[#fdf2f4] p-3 rounded-xl">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <div>
                            <h2 class="text-3xl md:text-4xl font-black text-gray-800 tracking-tight">Atividades do Seminário</h2>
                            <p class="text-lg text-gray-500 mt-2 font-medium">Selecione uma simulação baseada na Completinha S.A.</p>
                        </div>
                    </div>
                    
                    <div class="space-y-6">
                        <button onclick="renderActivity(0)" class="w-full text-left bg-white border-2 border-gray-200 hover:border-[#97164f] p-8 rounded-2xl transition duration-200 shadow-sm hover:shadow-md group">
                            <div class="flex items-center justify-between mb-3">
                                <div class="text-sm font-bold text-[#97164f] tracking-widest uppercase bg-[#fdf2f4] px-4 py-1.5 rounded-lg">Atividade 1</div>
                                <svg class="w-6 h-6 text-gray-300 group-hover:text-[#97164f] transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                            <div class="text-2xl font-bold text-gray-800 group-hover:text-[#97164f] transition">Balanço Patrimonial, DRE e DFC</div>
                        </button>
                        
                        <button onclick="renderActivity(1)" class="w-full text-left bg-white border-2 border-gray-200 hover:border-[#97164f] p-8 rounded-2xl transition duration-200 shadow-sm hover:shadow-md group">
                            <div class="flex items-center justify-between mb-3">
                                <div class="text-sm font-bold text-[#97164f] tracking-widest uppercase bg-[#fdf2f4] px-4 py-1.5 rounded-lg">Atividade 2</div>
                                <svg class="w-6 h-6 text-gray-300 group-hover:text-[#97164f] transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                            <div class="text-2xl font-bold text-gray-800 group-hover:text-[#97164f] transition">DMPL e Demonstração do Valor Adicionado (DVA)</div>
                        </button>
                        
                        <button onclick="renderActivity(2)" class="w-full text-left bg-white border-2 border-gray-200 hover:border-[#97164f] p-8 rounded-2xl transition duration-200 shadow-sm hover:shadow-md group">
                            <div class="flex items-center justify-between mb-3">
                                <div class="text-sm font-bold text-[#97164f] tracking-widest uppercase bg-[#fdf2f4] px-4 py-1.5 rounded-lg">Atividade 3</div>
                                <svg class="w-6 h-6 text-gray-300 group-hover:text-[#97164f] transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                            <div class="text-2xl font-bold text-gray-800 group-hover:text-[#97164f] transition">Relatório da Administração e Notas Explicativas</div>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderActivity(index) {
            const act = activities[index];
            let optionsHtml = '';
            
            act.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <button onclick="handleAnswer(${index}, ${optIndex})" class="w-full text-left p-6 mb-6 bg-white border-2 border-gray-200 rounded-xl hover:bg-[#fdf2f4] active:bg-gray-100 hover:border-[#97164f] transition duration-200 text-base md:text-lg font-medium text-gray-800 leading-relaxed shadow-sm">
                        ${opt}
                    </button>
                `;
            });

            app.innerHTML = `
                <div class="fade-in flex flex-col w-full h-full max-w-7xl mx-auto">
                    
                    <div class="flex items-center justify-between mb-8 border-b border-gray-200 pb-4">
                        <button onclick="renderSeminarioMenu()" class="text-gray-500 hover:text-[#97164f] flex items-center text-base font-bold transition bg-gray-50 hover:bg-[#fdf2f4] px-5 py-2.5 rounded-xl">
                            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Voltar
                        </button>
                        <span class="text-sm font-bold text-[#97164f] bg-[#fdf2f4] px-5 py-2.5 rounded-xl border border-[#d1b3c0] uppercase tracking-wider">${act.title.split(':')[0]}</span>
                    </div>
                    
                    <div class="flex flex-col lg:flex-row gap-10 lg:gap-14 pb-10">
                        <div class="w-full lg:w-[45%]">
                            <div class="bg-[#fdf2f4] border-l-4 border-[#97164f] p-6 rounded-r-2xl mb-8 shadow-sm">
                                <h3 class="text-[#97164f] font-black text-sm uppercase mb-3 flex items-center tracking-wide">
                                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                    Cenário (Seu Papel)
                                </h3>
                                <p class="text-base md:text-lg text-gray-800 leading-relaxed">${act.roleplay}</p>
                            </div>
                            ${act.panel}
                        </div>
                        
                        <div class="w-full lg:w-[55%] flex flex-col pt-2">
                            <h2 class="text-xl md:text-2xl font-black text-gray-900 mb-8 leading-relaxed border-b border-gray-200 pb-5">${act.question}</h2>
                            <div class="space-y-2">
                                ${optionsHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleAnswer(activityIndex, selectedOptionIndex) {
            const act = activities[activityIndex];
            const isCorrect = selectedOptionIndex === act.correctIndex;
            const feedbackText = act.feedbacks[selectedOptionIndex];
            
            if(isCorrect) {
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.5 },
                    colors: ['#97164f', '#d1b3c0', '#fdf2f4', '#10b981']
                });
            }

            const headerColor = isCorrect ? 'text-green-600' : 'text-[#97164f]';
            const icon = isCorrect 
                ? '<svg class="w-24 h-24 text-green-500 mx-auto mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'
                : '<svg class="w-24 h-24 text-[#97164f] mx-auto mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            
            let title = isCorrect ? 'Diagnóstico Correto!' : 'Foi quase! Tente novamente.';
            
            let quoteHtml = '';
            if(!isCorrect) {
                const randomQuote = motivationalQuotes[Math.floor(Math.random() * motivationalQuotes.length)];
                quoteHtml = `<div class="italic text-gray-500 text-lg mt-8 px-6 border-t border-gray-200 pt-6">"${randomQuote}"</div>`;
            }

            app.innerHTML = `
                <div class="fade-in flex flex-col text-center py-10 w-full max-w-4xl mx-auto">
                    <div class="flex-1 mt-4">
                        ${icon}
                        <h2 class="text-4xl md:text-5xl font-black ${headerColor} mb-10 tracking-tight">${title}</h2>
                        <div class="bg-gray-50 p-8 md:p-10 rounded-3xl border border-gray-200 text-left shadow-inner">
                            <p class="text-lg md:text-xl text-gray-800 leading-relaxed">
                                <span class="font-black ${headerColor} block mb-4 uppercase tracking-widest text-sm border-b border-gray-200 pb-2">Análise Técnica</span> 
                                ${feedbackText}
                            </p>
                        </div>
                        ${quoteHtml}
                    </div>
                    <div class="mt-12 flex flex-col sm:flex-row gap-5 justify-center">
                        <button onclick="renderActivity(${activityIndex})" class="w-full sm:w-auto bg-white border-2 border-gray-300 hover:bg-gray-50 text-gray-800 font-bold text-xl py-5 px-10 rounded-2xl transition duration-200 shadow-sm">
                            Tentar Novamente
                        </button>
                        <button onclick="renderSeminarioMenu()" class="w-full sm:w-auto bg-gray-800 hover:bg-gray-900 text-white font-bold text-xl py-5 px-10 rounded-2xl transition duration-200 shadow-md">
                            Voltar ao Menu
                        </button>
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderHome();
    </script>
</body>
</html>
